[workspace]
members = [
    "crates/etas_syntax",
    "crates/etas_hir",
    "crates/etas_hir_analysis",
    "crates/etas_types",
    "crates/etas_effects",
    "crates/etas_frontend",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/etas-project/etas-frontend"

[workspace.dependencies]
etas_cache = { git = "https://github.com/etas-project/etas-core.git", package = "etas_cache" }
etas_core = { git = "https://github.com/etas-project/etas-core.git", package = "etas_core" }
etas_std = { git = "https://github.com/etas-project/etas-core.git", package = "etas_std" }
etas_utils = { git = "https://github.com/etas-project/etas-core.git", package = "etas_utils" }
etas_syntax = { path = "crates/etas_syntax" }
etas_hir = { path = "crates/etas_hir" }
etas_hir_analysis = { path = "crates/etas_hir_analysis" }
etas_package_metadata = { git = "https://github.com/etas-project/etas-core.git", package = "etas_package_metadata" }
etas_types = { path = "crates/etas_types" }
etas_effects = { path = "crates/etas_effects" }
etas_frontend = { path = "crates/etas_frontend" }

ariadne = "0.5"
bincode = { version = "2", features = ["serde"] }
blake3 = "1"
clap = { version = "4.5", features = ["derive"] }
prost = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
zstd = "0.13"
